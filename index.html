<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WINK SHOT — 윙크 사격 좀비</title>
<style>
  /* 레트로 한글 픽셀폰트 */
  @import url('https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css');

  :root{
    --bg:#04140a;
    --bg2:#071c0d;
    --green:#39ff14;
    --green-dim:#1f7a3d;
    --green-deep:#0c3d1c;
    --ink:#bdffbd;
    --danger:#ff3b3b;
    --amber:#ffd23b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Galmuri11','DungGeunMo',monospace;
    overflow:hidden;
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
    cursor:none;
  }

  #stage{ position:fixed; inset:0; }
  canvas{ display:block; position:absolute; inset:0; width:100%; height:100%; }
  #game{ z-index:1; background:radial-gradient(circle at 50% 50%, #06210f 0%, #04140a 70%, #020a05 100%); }
  /* 위는 캔버스 클리어색이 아니라 단순 비네팅 — 그라데이션 금지는 UI/도형에 적용 */
  #cursor{ position:fixed; inset:0; z-index:100; pointer-events:none; }

  /* 스캔라인 오버레이 */
  #scan{
    position:fixed; inset:0; z-index:40; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply;
  }

  /* 웹캠 디버그 미리보기 */
  #camWrap{
    position:fixed; right:14px; bottom:14px; z-index:45;
    width:188px; height:106px;
    border:2px solid var(--green-dim);
    background:#000; overflow:hidden;
  }
  #camWrap video{ display:none; }
  #cam{ width:100%; height:100%; }
  #camLabel{
    position:absolute; top:0; left:0; font-size:9px; padding:1px 5px;
    background:var(--green-deep); color:var(--green); letter-spacing:1px;
  }

  /* HUD */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:30; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; font-size:16px; letter-spacing:1px;
    text-shadow:0 0 6px rgba(57,255,20,.5);
  }
  #hud .box{ background:rgba(4,20,10,.6); border:2px solid var(--green-dim); padding:6px 12px; }
  #hud .lab{ color:var(--green-dim); font-size:11px; display:block; }
  #hud .val{ color:var(--green); font-size:20px; }
  #hp{ display:flex; gap:4px; margin-top:3px; }
  #hp i{ width:14px; height:14px; background:var(--danger); display:inline-block; box-shadow:0 0 6px var(--danger); }
  #hp i.lost{ background:var(--green-deep); box-shadow:none; }
  #dualBadge{ color:#04140a !important; background:var(--amber) !important; border-color:var(--amber) !important;
    font-size:16px; padding:8px 12px; letter-spacing:1px; box-shadow:0 0 18px rgba(255,210,59,.7);
    animation:bl .8s steps(2) infinite; }

  /* 오버레이 화면 (시작/오버) */
  .screen{
    position:fixed; inset:0; z-index:35;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(2,10,5,.86); text-align:center; gap:22px; padding:30px;
  }
  .screen.hidden{ display:none; }
  .title{
    font-family:'Galmuri14','Galmuri11',monospace;
    font-size:64px; color:var(--green); letter-spacing:4px; line-height:1.1;
    text-shadow:0 0 2px #000, 4px 4px 0 var(--green-deep), 0 0 24px rgba(57,255,20,.6);
  }
  .title small{ display:block; font-size:18px; color:var(--ink); letter-spacing:6px; margin-top:10px; text-shadow:none; }
  .sub{ font-size:15px; color:var(--ink); line-height:2; max-width:520px; }
  .sub b{ color:var(--amber); }
  .score-big{ font-size:30px; color:var(--amber); }

  /* 각진 레트로 버튼 (그라데이션 없음, 직각) */
  .btn{
    pointer-events:auto;
    font-family:inherit; font-size:22px; letter-spacing:2px;
    color:var(--green); background:var(--bg2);
    border:3px solid var(--green); border-radius:0;
    padding:16px 40px; cursor:none; position:relative;
    transition:none; text-shadow:0 0 6px rgba(57,255,20,.5);
  }
  .btn::after{ content:''; position:absolute; inset:3px; border:1px solid var(--green-dim); }
  .btn.hover{ background:var(--green); color:#04140a; text-shadow:none; box-shadow:0 0 22px rgba(57,255,20,.8); }
  .btn .dwell{ position:absolute; left:0; bottom:-7px; height:4px; width:0; background:var(--amber); }

  #status{
    position:fixed; left:0; right:0; bottom:24px; z-index:36; text-align:center;
    font-size:13px; color:var(--green-dim); letter-spacing:1px;
  }
  .spinner{
    display:inline-block; width:10px; height:10px; margin-right:8px;
    border:2px solid var(--green-deep); border-top-color:var(--green);
    border-radius:50%; animation:sp .7s linear infinite; vertical-align:middle;
  }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .blink{ animation:bl 1s steps(2) infinite; }
  @keyframes bl{ 50%{ opacity:.25; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
</div>
<div id="scan"></div>
<!-- 조준점은 모든 오버레이 위에 떠야 하므로 stage 밖, 최상단 -->
<canvas id="cursor"></canvas>

<div id="hud" class="hidden">
  <div style="display:flex;gap:10px;align-items:flex-start">
    <div class="box"><span class="lab">SCORE</span><span class="val" id="score">0</span></div>
    <div class="box"><span class="lab">KILLS</span><span class="val" id="kills">0</span></div>
    <div class="box"><span class="lab">WAVE</span><span class="val" id="wave">1</span></div>
  </div>
  <div style="display:flex;gap:10px;align-items:flex-start">
    <div class="box" id="dualBadge" style="display:none">⚡ 쌍권총 ⚡</div>
    <div class="box"><span class="lab">HP</span><div id="hp"></div></div>
  </div>
</div>

<!-- 시작 화면 -->
<div class="screen" id="startScreen">
  <div class="title">WINK<br>SHOT<small>윙크 사격 좀비</small></div>
  <div class="sub">
    검지 손가락으로 <b>조준점</b>을 움직이고<br>
    <b>윙크(한쪽 눈 감기)</b> 로 좀비를 사격하세요.<br>
    조준점을 버튼에 올리고 윙크하면 클릭됩니다.<br>
    <b style="color:#23e0ff">10킬 달성 시 쌍권총</b> — 양손으로 조준점 2개!
  </div>
  <button class="btn" id="startBtn" data-action="start">▶ 게임 시작</button>
</div>

<!-- 게임 오버 -->
<div class="screen hidden" id="overScreen">
  <div class="title" style="font-size:48px;color:var(--danger);text-shadow:4px 4px 0 #3d0c0c,0 0 24px rgba(255,59,59,.6)">GAME OVER</div>
  <div class="sub">최종 점수<br><span class="score-big" id="finalScore">0</span></div>
  <button class="btn" id="retryBtn" data-action="start">↻ 다시 도전</button>
</div>

<div id="status"><span class="spinner"></span>준비 중…</div>

<div id="camWrap">
  <span id="camLabel">CAM</span>
  <video id="video" playsinline></video>
  <canvas id="cam"></canvas>
</div>

<script type="module">
import { HandLandmarker, FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ───────────────────────── 캔버스 셋업 ───────────────────────── */
const gameCv = document.getElementById('game');
const curCv  = document.getElementById('cursor');
const gtx = gameCv.getContext('2d');
const ctx = curCv.getContext('2d');
const camCv = document.getElementById('cam');
const cmx = camCv.getContext('2d');
const video = document.getElementById('video');

let W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  for(const cv of [gameCv,curCv]){
    cv.width=W*DPR; cv.height=H*DPR;
    cv.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
  }
}
window.addEventListener('resize',resize); resize();
camCv.width=188; camCv.height=106;

/* ───────────────────────── 상태 ───────────────────────── */
const statusEl = document.getElementById('status');
const hudEl    = document.getElementById('hud');
const startScreen = document.getElementById('startScreen');
const overScreen  = document.getElementById('overScreen');
const scoreEl = document.getElementById('score');
const killsEl = document.getElementById('kills');
const waveEl  = document.getElementById('wave');
const hpEl    = document.getElementById('hp');
const dualBadge = document.getElementById('dualBadge');
const finalScoreEl = document.getElementById('finalScore');

const STATE = { MENU:'menu', PLAY:'play', OVER:'over' };
let state = STATE.MENU;

// 조준점 (화면 좌표, 스무딩 적용)
const aim  = { x:W/2, y:H/2, tx:W/2, ty:H/2, found:false }; // 1번 손(왼쪽)
const aim2 = { x:W/2, y:H/2, tx:W/2, ty:H/2, found:false }; // 2번 손(오른쪽, 쌍권총)
const AIM_GAIN = 2.3;     // 손가락 움직임 증폭
const AIM_SMOOTH = 0.35;  // lerp 계수
const clamp01 = v=>Math.max(0,Math.min(1,v));

// 윙크 / 발사 입력
let winkArmed = true;     // 다시 무장됐는지 (눈 떠야 재무장)
let fireEvent = false;    // 이번 프레임 발사 트리거
let winkActive = false;   // 현재 윙크 중(시각 표시)

/* ───────────────────────── 효과음 (Web Audio 합성) ───────────────────────── */
let actx=null;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
// 자동재생 정책: 사용자 제스처에서 오디오 컨텍스트 깨우기
['pointerdown','keydown','touchstart'].forEach(ev=>
  window.addEventListener(ev,()=>audio(),{passive:true}));

function tone({type='square',f0=440,f1=null,dur=0.1,vol=0.2,delay=0}){
  const a=audio(); if(!a) return;
  const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise({dur=0.15,vol=0.25,cut=1400,delay=0}){
  const a=audio(); if(!a) return;
  const t=a.currentTime+delay;
  const n=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
// "퓨!" 레이저 사격음
function sfxShoot(){ tone({type:'square',f0:900,f1:180,dur:0.10,vol:0.16}); noise({dur:0.05,vol:0.08,cut:3000}); }
// 쌍권총: 살짝 디튠한 두 발
function sfxShootDual(){ tone({type:'square',f0:900,f1:180,dur:0.10,vol:0.14}); tone({type:'square',f0:760,f1:150,dur:0.11,vol:0.12,delay:0.03}); noise({dur:0.05,vol:0.08,cut:3000}); }
// 명중(처치 전) 틱
function sfxHit(){ tone({type:'triangle',f0:520,f1:760,dur:0.05,vol:0.12}); }
// 좀비 처치 폭발
function sfxKill(){ noise({dur:0.22,vol:0.28,cut:900}); tone({type:'sawtooth',f0:240,f1:60,dur:0.2,vol:0.18}); }
// 주인공 피격
function sfxDamage(){ tone({type:'square',f0:160,f1:50,dur:0.25,vol:0.25}); noise({dur:0.18,vol:0.18,cut:600}); }
// 쌍권총 활성 팡파레
function sfxDual(){ [523,659,784,1047].forEach((f,i)=>tone({type:'square',f0:f,dur:0.12,vol:0.18,delay:i*0.09})); }
// 게임 오버 하강음
function sfxOver(){ [392,330,262,196].forEach((f,i)=>tone({type:'sawtooth',f0:f,dur:0.3,vol:0.2,delay:i*0.18})); }

/* ───────────────────────── 게임 데이터 ───────────────────────── */
const player = { hp:5, maxHp:5 };
let zombies = [];
let particles = [];
let shots = [];     // 사격 레이저 잔상
let popups = [];    // 점수 팝업
let banner = { text:'', life:0 };  // 화면 중앙 알림
let score=0, wave=1, kills=0, spawnTimer=0, spawnGap=1.6, elapsed=0;
let dualMode=false; // 쌍권총 모드
let muzzle=0;       // 발사 플래시 타이머
let shake=0;        // 화면 흔들림
const DUAL_AT=10;   // 쌍권총 활성 킬 수

const TYPES = {
  normal:{ hp:1, speed:42,  r:36, score:10, body:'#3bd16a', dark:'#187a39', name:'일반' },
  fast:  { hp:1, speed:86,  r:29, score:15, body:'#c8ff4d', dark:'#6f8a1f', name:'빠른' },
  big:   { hp:3, speed:24,  r:66, score:30, body:'#1f8a45', dark:'#0c3d1c', name:'큰놈' },
};

function resetGame(){
  player.hp=player.maxHp;
  zombies=[]; particles=[]; shots=[]; popups=[];
  banner={text:'',life:0};
  score=0; wave=1; kills=0; dualMode=false;
  spawnTimer=0; spawnGap=1.6; elapsed=0; muzzle=0; shake=0;
  dualBadge.style.display='none';
  syncHud();
}
function syncHud(){
  scoreEl.textContent=score;
  killsEl.textContent=kills;
  waveEl.textContent=wave;
  hpEl.innerHTML='';
  for(let i=0;i<player.maxHp;i++){
    const i2=document.createElement('i');
    if(i>=player.hp) i2.className='lost';
    hpEl.appendChild(i2);
  }
}
function checkDual(){
  if(!dualMode && kills>=DUAL_AT){
    dualMode=true;
    dualBadge.style.display='block';
    banner={ text:'쌍권총 모드!', life:2.4 };
    sfxDual();
  }
}

function spawnZombie(){
  // 가장자리 랜덤 위치
  const edge = Math.floor(rand(0,4));
  let x,y;
  if(edge===0){ x=rand(0,W); y=-40; }
  else if(edge===1){ x=W+40; y=rand(0,H); }
  else if(edge===2){ x=rand(0,W); y=H+40; }
  else { x=-40; y=rand(0,H); }

  // 웨이브에 따라 빠른/큰놈 비중 증가
  const roll=Math.random();
  let key='normal';
  const fastChance=Math.min(.15+wave*0.05,.45);
  const bigChance =Math.min(.05+wave*0.04,.30);
  if(roll<bigChance) key='big';
  else if(roll<bigChance+fastChance) key='fast';
  const t=TYPES[key];
  zombies.push({ key, x,y, hp:t.hp, maxHp:t.hp, t, wob:rand(0,6.28), hitFlash:0 });
}

function rand(a,b){ return a+Math.random()*(b-a); }

/* ───────────────────────── 사격 처리 ───────────────────────── */
function doShot(){
  muzzle=1; shake=Math.max(shake,dualMode?7:5);
  dualMode ? sfxShootDual() : sfxShoot();

  const dead=[];
  // 1번 손(왼쪽 총)은 항상 사격
  fireFrom(aim.x, aim.y, dead);
  // 쌍권총: 2번 손(오른쪽 총)도 동시에 사격
  if(dualMode && aim2.found) fireFrom(aim2.x, aim2.y, dead);

  // 처치 처리 — 점수 누적 + 팝업 (양손이 같은 좀비를 잡아도 1회만 집계)
  for(const z of dead){
    const i=zombies.indexOf(z);
    if(i<0) continue;
    score+=z.t.score; kills++;
    popups.push({ x:z.x, y:z.y, text:'+'+z.t.score, life:1, color:'#ffd23b' });
    deathParticles(z.x,z.y,z.t.body);
    sfxKill();
    zombies.splice(i,1);
  }
  if(dead.length){ syncHud(); checkDual(); }
}

// 한 조준점에서 한 발 — 조준 반경 안의 가장 가까운 좀비를 명중
function fireFrom(ax,ay,dead){
  let best=null, bestD=Infinity;
  for(const z of zombies){
    const d=Math.hypot(z.x-ax, z.y-ay);
    if(d<=z.t.r && d<bestD){ best=z; bestD=d; }
  }
  if(best){
    best.hp--; best.hitFlash=1;
    hitParticles(best.x,best.y, best.t.body, 8);
    shots.push({ x:best.x, y:best.y, life:1 });
    if(best.hp<=0){ if(!dead.includes(best)) dead.push(best); }
    else sfxHit();
  } else { // 빗나감
    shots.push({ x:ax, y:ay, life:1 });
    hitParticles(ax,ay,'#2c6b3a',4);
  }
}

function hitParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=rand(0,6.28), s=rand(40,180);
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(.2,.5), color, sz:rand(2,4) });
  }
}
function deathParticles(x,y,color){
  for(let i=0;i<18;i++){
    const a=rand(0,6.28), s=rand(60,260);
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(.4,.9), color, sz:rand(3,6) });
  }
}

/* ───────────────────────── UI 버튼 (조준점+윙크 클릭) ───────────────────────── */
let hoverBtn=null, dwell=0;
function updateButtons(fire){
  const btns=[...document.querySelectorAll('.screen:not(.hidden) .btn')];
  let over=null;
  for(const b of btns){
    const r=b.getBoundingClientRect();
    if(aim.x>=r.left && aim.x<=r.right && aim.y>=r.top && aim.y<=r.bottom){ over=b; break; }
  }
  if(over!==hoverBtn){ hoverBtn?.classList.remove('hover'); dwell=0; }
  hoverBtn=over;
  if(over){
    over.classList.add('hover');
    if(fire){ activateBtn(over); }
  }
}
function activateBtn(b){
  const action=b.dataset.action;
  if(action==='start') startGame();
}

/* ───────────────────────── 게임 흐름 ───────────────────────── */
function startGame(){
  resetGame();
  state=STATE.PLAY;
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  hudEl.classList.remove('hidden');
}
function gameOver(){
  state=STATE.OVER;
  finalScoreEl.textContent=score;
  hudEl.classList.add('hidden');
  overScreen.classList.remove('hidden');
  sfxOver();
}

/* ───────────────────────── 업데이트 ───────────────────────── */
let lastT=performance.now();
function update(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;

  // 조준점 스무딩
  aim.x += (aim.tx-aim.x)*AIM_SMOOTH;
  aim.y += (aim.ty-aim.y)*AIM_SMOOTH;
  aim2.x += (aim2.tx-aim2.x)*AIM_SMOOTH;
  aim2.y += (aim2.ty-aim2.y)*AIM_SMOOTH;

  const fire=fireEvent; fireEvent=false;

  if(state===STATE.PLAY){
    elapsed+=dt;
    // 웨이브: 12초마다 난이도 상승
    const newWave=1+Math.floor(elapsed/12);
    if(newWave!==wave){ wave=newWave; spawnGap=Math.max(0.45,1.6-wave*0.13); syncHud(); }

    // 스폰
    spawnTimer-=dt;
    if(spawnTimer<=0){ spawnZombie(); spawnTimer=spawnGap*rand(0.7,1.2); }

    // 사격
    if(fire) doShot();

    // 좀비 이동
    const cx=W/2, cy=H/2;
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      const dx=cx-z.x, dy=cy-z.y, d=Math.hypot(dx,dy)||1;
      z.x+=dx/d*z.t.speed*dt;
      z.y+=dy/d*z.t.speed*dt;
      z.wob+=dt*8;
      if(z.hitFlash>0) z.hitFlash-=dt*4;
      if(d<58){ // 주인공 도달
        player.hp--; shake=Math.max(shake,14);
        deathParticles(z.x,z.y,'#ff5a5a'); sfxDamage();
        zombies.splice(i,1); syncHud();
        if(player.hp<=0){ gameOver(); }
      }
    }
  } else {
    // 메뉴/오버 — 버튼 상호작용
    updateButtons(fire);
  }

  // 파티클
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=shots.length-1;i>=0;i--){ shots[i].life-=dt*3.5; if(shots[i].life<=0) shots.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y-=34*dt; p.life-=dt*0.9; if(p.life<=0) popups.splice(i,1); }
  if(banner.life>0) banner.life-=dt;
  if(muzzle>0) muzzle-=dt*5;
  if(shake>0) shake-=dt*30;
}

/* ───────────────────────── 렌더 ───────────────────────── */
function render(){
  gtx.clearRect(0,0,W,H);
  ctx.clearRect(0,0,W,H);

  const sx=shake>0?rand(-shake,shake):0;
  const sy=shake>0?rand(-shake,shake):0;
  gtx.save(); gtx.translate(sx,sy);

  // 바닥 격자 (레트로)
  drawGrid();

  if(state===STATE.PLAY || state===STATE.OVER){
    // 사격 레이저 (주인공→피탄점 잔상)
    for(const s of shots){
      gtx.globalAlpha=s.life*0.8;
      gtx.strokeStyle='#eaffea'; gtx.lineWidth=2;
      gtx.beginPath(); gtx.moveTo(W/2,H/2); gtx.lineTo(s.x,s.y); gtx.stroke();
    }
    gtx.globalAlpha=1;

    // 좀비
    for(const z of zombies) drawZombie(z);

    // 주인공
    drawPlayer(W/2,H/2);
  }

  // 파티클
  for(const p of particles){
    gtx.globalAlpha=Math.max(0,p.life*2);
    gtx.fillStyle=p.color;
    gtx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
  }
  gtx.globalAlpha=1;
  gtx.restore();

  // 점수 팝업 (흔들림 영향 X)
  gtx.textAlign='center'; gtx.font="bold 22px 'Galmuri11',monospace";
  for(const p of popups){
    gtx.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));
    gtx.fillStyle='#04140a'; gtx.fillText(p.text,p.x+2,p.y+2);
    gtx.fillStyle=p.color;   gtx.fillText(p.text,p.x,p.y);
  }
  gtx.globalAlpha=1;

  // 조준점 (항상 최상단, 흔들림 영향 X)
  drawCrosshair(aim.x,aim.y,aim.found,'#39ff14');
  // 쌍권총: 두 번째 손 조준점 (시안)
  if(dualMode && aim2.found) drawCrosshair(aim2.x,aim2.y,true,'#23e0ff');

  // 중앙 알림 배너 (조준점 캔버스 = 최상단)
  if(banner.life>0){
    ctx.save();
    ctx.globalAlpha=Math.min(1,banner.life);
    ctx.textAlign='center';
    ctx.font="40px 'Galmuri14','Galmuri11',monospace";
    ctx.fillStyle='#04140a'; ctx.fillText(banner.text,W/2+3,H*0.28+3);
    ctx.fillStyle='#ffd23b'; ctx.shadowColor='#ffd23b'; ctx.shadowBlur=22;
    ctx.fillText(banner.text,W/2,H*0.28);
    ctx.restore();
  }
}

function drawGrid(){
  gtx.strokeStyle='rgba(31,122,61,.18)'; gtx.lineWidth=1;
  const g=46;
  for(let x=(W/2)%g;x<W;x+=g){ gtx.beginPath(); gtx.moveTo(x,0); gtx.lineTo(x,H); gtx.stroke(); }
  for(let y=(H/2)%g;y<H;y+=g){ gtx.beginPath(); gtx.moveTo(0,y); gtx.lineTo(W,y); gtx.stroke(); }
}

function px(x,y,w,h,c){ gtx.fillStyle=c; gtx.fillRect(Math.round(x),Math.round(y),w,h); }

function drawPlayer(x,y){
  const u=9; // 픽셀 단위
  const C='#7CFFB0', D='#2f8f5a', SK='#e7c7a0';
  gtx.save(); gtx.translate(x,y);
  // 그림자 링 (쌍권총이면 금색)
  gtx.strokeStyle= dualMode?'rgba(255,210,59,.5)':'rgba(57,255,20,.35)';
  gtx.lineWidth=2;
  gtx.beginPath(); gtx.arc(0,0,60,0,6.28); gtx.stroke();
  // 다리
  px(-u*1.0,u*1.4,u*0.8,u*1.8,D);
  px(u*0.3, u*1.4,u*0.8,u*1.8,D);
  // 방탄 조끼 몸통
  px(-u*1.6,-u*1.0,u*3.2,u*2.6,C);
  px(-u*1.6,-u*1.0,u*3.2,u*0.6,D);   // 카라
  px(-u*0.25,-u*0.8,u*0.5,u*2.2,D);  // 지퍼
  px(u*0.7,-u*0.4,u*0.6,u*0.6,'#ffd23b'); // 탄띠 배지
  // 머리 + 빨간 두건
  px(-u*1.0,-u*3.2,u*2.0,u*2.0,SK);
  px(-u*1.0,-u*3.2,u*2.0,u*0.7,'#c0392b'); // 두건
  px(-u*1.0,-u*2.55,u*0.5,u*0.4,'#c0392b'); // 두건 꼬리
  px(-u*0.55,-u*2.4,u*0.45,u*0.45,'#222'); // 눈
  px(u*0.15,-u*2.4,u*0.45,u*0.45,'#222');
  gtx.restore();
  // 조준 방향 총 — 쌍권총이면 각 총이 자기 조준점을 겨냥
  const a1=Math.atan2(aim.y-y,aim.x-x);
  if(dualMode){
    drawGun(x,y,a1,-1);
    const a2=aim2.found ? Math.atan2(aim2.y-y,aim2.x-x) : a1;
    drawGun(x,y,a2,1);
  } else {
    drawGun(x,y,a1,0);
  }
}
function drawGun(x,y,a,side){
  gtx.save(); gtx.translate(x,y); gtx.rotate(a);
  gtx.translate(0, side*15); // 좌우 손 오프셋(조준축 기준 수직)
  px(2,-5,9,10,'#9fe9b6');   // 그립/몸체
  px(8,-3,18,6,'#dfffe9');   // 총열
  px(25,-2.5,5,5,'#ffd23b'); // 총구
  if(muzzle>0.4){ // 머즐 플래시
    gtx.globalAlpha=(muzzle-0.4)*1.6;
    px(29,-4,8,8,'#ffffff'); gtx.globalAlpha=1;
  }
  gtx.restore();
}

function drawZombie(z){
  const t=z.t, u=t.r/4;
  const flash=z.hitFlash>0;
  const body=flash?'#ffffff':t.body;
  const dark=flash?'#ffd0d0':t.dark;
  gtx.save(); gtx.translate(z.x,z.y);
  if(z.key==='fast')      drawFastZombie(z,u,body,dark);
  else if(z.key==='big')  drawBigZombie(z,u,body,dark);
  else                    drawNormalZombie(z,u,body,dark);
  if(t.hp>1){ // 체력바 (큰놈)
    const w=t.r*1.7;
    gtx.fillStyle='#0c3d1c'; gtx.fillRect(-w/2,-t.r-16,w,5);
    gtx.fillStyle='#39ff14'; gtx.fillRect(-w/2,-t.r-16,w*(z.hp/z.maxHp),5);
  }
  gtx.restore();
}

// 일반: 비틀대며 양팔을 앞으로 뻗은 표준 좀비, 찢긴 옷·상처
function drawNormalZombie(z,u,body,dark){
  const sway=Math.sin(z.wob)*u*0.35;
  const sk='#cdb89a';
  // 다리 (엇갈린 걸음)
  px(-u*1.3, u*2.0, u*1.0, u*1.9+sway, dark);
  px(u*0.4,  u*2.0, u*1.0, u*1.9-sway, dark);
  // 몸통 + 찢긴 옷
  px(-u*2.0,-u*1.0,u*4,u*3.2,body);
  px(-u*2.0,-u*1.0,u*4,u*0.7,dark);
  px(-u*0.3,u*0.4,u*0.6,u*1.2,'#7a1f1f'); // 가슴 상처
  px(-u*1.6,u*1.4,u*1.0,u*0.5,dark);
  // 앞으로 뻗은 팔 + 손
  px(-u*3.0,-u*0.5+sway,u*1.1,u*2.0,body);
  px(u*1.9, -u*0.5-sway,u*1.1,u*2.0,body);
  px(-u*3.0,u*1.3+sway,u*1.1,u*0.8,sk);
  px(u*1.9, u*1.3-sway,u*1.1,u*0.8,sk);
  // 머리
  px(-u*1.4+sway*0.5,-u*3.8,u*2.8,u*2.8,body);
  px(-u*0.9,-u*3.0,u*0.7,u*0.7,'#ff2b2b'); // 눈
  px(u*0.3, -u*3.0,u*0.7,u*0.7,'#ff2b2b');
  px(-u*0.8,-u*1.6,u*1.6,u*0.5,'#3a0a0a'); // 입
}

// 빠른: 앞으로 기울인 날렵한 실루엣 + 속도선, 가는 팔다리
function drawFastZombie(z,u,body,dark){
  const lean=u*0.9, run=Math.sin(z.wob*1.6)*u*0.9;
  // 진행 반대 방향으로 속도선
  const ang=Math.atan2(z.y-H/2, z.x-W/2);
  gtx.save();
  gtx.globalAlpha=.45; gtx.strokeStyle=body; gtx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    const ox=-Math.sin(ang)*i*u*1.3, oy=Math.cos(ang)*i*u*1.3;
    gtx.beginPath();
    gtx.moveTo(Math.cos(ang)*u*2.5+ox, Math.sin(ang)*u*2.5+oy);
    gtx.lineTo(Math.cos(ang)*u*6.0+ox, Math.sin(ang)*u*6.0+oy);
    gtx.stroke();
  }
  gtx.restore();
  // 질주 다리 (앞뒤로 벌림)
  px(-u*1.8+lean, u*1.6, u*0.8, u*2.0+run, dark);
  px(u*0.7+lean,  u*1.6, u*0.8, u*2.0-run, dark);
  // 기울인 가는 몸통
  px(-u*1.3+lean,-u*1.2,u*2.4,u*3.0,body);
  px(-u*1.3+lean,-u*1.2,u*2.4,u*0.5,dark);
  // 뒤로 젖힌 팔 + 앞으로 뻗은 팔
  px(-u*2.6+lean*0.4,-u*0.6,u*0.9,u*1.8,body);
  px(u*0.9+lean*1.6,-u*1.0,u*0.9,u*1.7,body);
  // 앞으로 내민 작은 머리
  px(-u*0.4+lean*1.7,-u*3.4,u*2.2,u*2.2,body);
  px(u*0.4+lean*1.7,-u*2.7,u*0.6,u*0.6,'#ff2b2b'); // 눈
  px(u*1.2+lean*1.7,-u*1.9,u*0.8,u*0.4,'#3a0a0a'); // 벌린 입
}

// 큰놈: 거대한 어깨·두꺼운 팔, 작게 파묻힌 머리, 꿰맨 자국
function drawBigZombie(z,u,body,dark){
  const sway=Math.sin(z.wob*0.7)*u*0.25;
  // 굵은 다리
  px(-u*1.9, u*2.2, u*1.6, u*1.9, dark);
  px(u*0.3,  u*2.2, u*1.6, u*1.9, dark);
  // 거대한 몸통
  px(-u*2.9,-u*1.6,u*5.8,u*4.0,body);
  px(-u*2.9,-u*1.6,u*5.8,u*0.9,dark); // 어깨 그늘
  // 꿰맨 자국 (세로 + 가로 스티치)
  px(-u*0.1,-u*1.4,u*0.3,u*3.4,dark);
  for(let i=-1;i<4;i++) px(-u*0.5,(-u*1.0)+i*u*0.9,u*1.1,u*0.18,dark);
  // 두꺼운 팔 + 주먹
  px(-u*4.2,-u*1.2+sway,u*1.5,u*3.4,body);
  px(u*2.7, -u*1.2-sway,u*1.5,u*3.4,body);
  px(-u*4.4,u*1.9+sway,u*1.9,u*1.2,dark);
  px(u*2.5, u*1.9-sway,u*1.9,u*1.2,dark);
  // 작게 파묻힌 머리 + 두꺼운 눈썹
  px(-u*1.3+sway*0.5,-u*3.0,u*2.6,u*1.9,body);
  px(-u*1.3,-u*3.0,u*2.6,u*0.45,dark); // 눈썹
  px(-u*0.8,-u*2.5,u*0.7,u*0.7,'#ff2b2b');
  px(u*0.2, -u*2.5,u*0.7,u*0.7,'#ff2b2b');
}

function drawCrosshair(x,y,found=true,base='#39ff14'){
  const r=36;
  ctx.save(); ctx.translate(x,y);
  const col=winkActive?'#ffd23b':base;
  ctx.strokeStyle=col; ctx.lineWidth=4;
  ctx.shadowColor=col; ctx.shadowBlur=18;
  // 원
  ctx.beginPath(); ctx.arc(0,0,r,0,6.28); ctx.stroke();
  // 십자
  ctx.beginPath();
  ctx.moveTo(-r-14,0); ctx.lineTo(-10,0);
  ctx.moveTo(r+14,0);  ctx.lineTo(10,0);
  ctx.moveTo(0,-r-14); ctx.lineTo(0,-10);
  ctx.moveTo(0,r+14);  ctx.lineTo(0,10);
  ctx.stroke();
  ctx.shadowBlur=0;
  // 중심점
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,5,0,6.28); ctx.fill();
  // 발사 플래시
  if(muzzle>0){
    ctx.globalAlpha=muzzle;
    ctx.strokeStyle='#fff'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,r+20*(1-muzzle)+12,0,6.28); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // 손가락 미감지 안내
  if(!found){
    ctx.fillStyle='#ff3b3b'; ctx.font="13px 'Galmuri11',monospace";
    ctx.textAlign='center'; ctx.fillText('손을 보여주세요',0,r+30);
  }
  ctx.restore();
}

/* ───────────────────────── MediaPipe ───────────────────────── */
let handLM=null, faceLM=null, ready=false;

async function setupModels(){
  statusEl.innerHTML=`<span class="spinner"></span>인식 모델 불러오는 중…`;
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  handLM=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numHands:2
  });
  faceLM=await FaceLandmarker.createFromOptions(vision,{
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU" },
    runningMode:"VIDEO", numFaces:1, outputFaceBlendshapes:true
  });
}
async function setupCamera(){
  statusEl.innerHTML=`<span class="spinner"></span>카메라 여는 중…`;
  const stream=await navigator.mediaDevices.getUserMedia({
    video:{ width:{ideal:640}, height:{ideal:360}, facingMode:"user" }, audio:false });
  video.srcObject=stream;
  await new Promise(res=>video.onloadedmetadata=()=>{ video.play(); res(); });
}

const WINK_ON=0.40, WINK_OFF=0.22, OPEN=0.55;
let lastVideoTime=-1;

function processVision(now){
  if(!ready || video.readyState<2) return;
  if(video.currentTime===lastVideoTime) return;
  lastVideoTime=video.currentTime;

  // 손 → 조준점 (최대 2개)
  const hr=handLM.detectForVideo(video,now);
  const hands=(hr && hr.landmarks)?hr.landmarks:[];
  // 각 손 검지끝(8)을 미러+증폭해서 화면좌표로
  const pts=hands.map(lm=>{
    const tip=lm[8];
    const ax=clamp01(0.5+((1-tip.x)-0.5)*AIM_GAIN);
    const ay=clamp01(0.5+(tip.y-0.5)*AIM_GAIN);
    return { x:ax*W, y:ay*H };
  });
  // 화면 x 기준 정렬 → 왼쪽 손=aim, 오른쪽 손=aim2
  pts.sort((a,b)=>a.x-b.x);
  if(pts.length>=1){ aim.tx=pts[0].x; aim.ty=pts[0].y; aim.found=true; }
  else aim.found=false;
  if(pts.length>=2){ aim2.tx=pts[1].x; aim2.ty=pts[1].y; aim2.found=true; }
  else aim2.found=false;
  drawCamDebug(hands);

  // 얼굴 → 윙크
  const fr=faceLM.detectForVideo(video,now);
  let bl=0,br=0;
  if(fr && fr.faceBlendshapes && fr.faceBlendshapes.length){
    for(const c of fr.faceBlendshapes[0].categories){
      if(c.categoryName==='eyeBlinkLeft') bl=c.score;
      else if(c.categoryName==='eyeBlinkRight') br=c.score;
    }
  }
  // 윙크 = 한쪽만 강하게 감김 (자연스러운 양눈 깜빡임 배제)
  const wink = (bl>WINK_ON && br<OPEN) || (br>WINK_ON && bl<OPEN);
  const bothOpen = bl<WINK_OFF && br<WINK_OFF;
  winkActive=wink;
  if(wink && winkArmed){ fireEvent=true; winkArmed=false; }
  if(bothOpen) winkArmed=true; // 눈 뜨면 재무장
}

function drawCamDebug(hands){
  cmx.save();
  cmx.fillStyle='#000'; cmx.fillRect(0,0,188,106);
  // 미러 영상 대신 랜드마크만 표시 (가벼움)
  cmx.translate(188,0); cmx.scale(-1,1); // 미러
  for(const lm of (hands||[])){
    cmx.fillStyle='#39ff14';
    for(const p of lm){ cmx.fillRect(p.x*188-1,p.y*106-1,2,2); }
    const t=lm[8]; // 검지 끝 강조
    cmx.fillStyle='#ffd23b'; cmx.fillRect(t.x*188-3,t.y*106-3,6,6);
  }
  cmx.restore();
  if(winkActive){ cmx.fillStyle='#ffd23b'; cmx.fillRect(0,0,188,4); }
}

/* ───────────────────────── 메인 루프 ───────────────────────── */
function loop(now){
  processVision(now);
  update(now);
  render();
  requestAnimationFrame(loop);
}

/* ───────────────────────── 부트 ───────────────────────── */
(async function boot(){
  syncHud();
  requestAnimationFrame(loop); // 모델 로딩 전에도 조준점/메뉴 렌더
  try{
    await setupModels();
    await setupCamera();
    ready=true;
    statusEl.innerHTML=`<span style="color:var(--green)">●</span> 인식 준비 완료 — 검지로 조준, 윙크로 발사`;
    setTimeout(()=>statusEl.classList.add('blink'),2500);
  }catch(e){
    console.error(e);
    statusEl.innerHTML=`<span style="color:var(--danger)">카메라/모델 오류:</span> ${e.message} — 웹캠 권한을 확인하세요`;
  }
})();

// 키보드 폴백 (디버그/접근성): 스페이스=발사, 마우스로도 조준 가능
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); if(winkArmed){fireEvent=true;winkArmed=false;} } });
window.addEventListener('keyup',e=>{ if(e.code==='Space') winkArmed=true; });
window.addEventListener('mousemove',e=>{ if(!aim.found){ aim.tx=e.clientX; aim.ty=e.clientY; } });
window.addEventListener('mousedown',()=>{ if(!aim.found && winkArmed){ fireEvent=true; winkArmed=false; } });
window.addEventListener('mouseup',()=>{ winkArmed=true; });
</script>
</body>
